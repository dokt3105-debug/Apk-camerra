
name: Build Camera View APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download original source
        run: |
          curl -L "https://github.com/akarshit-1609/camera-view/archive/refs/heads/main.zip" -o source.zip
          unzip source.zip
          cp -r camera-view-main/. app/

      - name: Build APK
        run: |
          chmod +x app/gradlew 2>/dev/null || true
          cd app
          if [ -f gradlew ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camera-view-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
